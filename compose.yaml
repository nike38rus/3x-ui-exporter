services:
  exporter:
    image: ghcr.io/nike38rus/3x-ui-exporter:${EXPORTER_VERSION:-1.4.1}
    network_mode: container:${XRAY_CONTAINER:-3xui_app}
    environment:
      XUI_URL: ${XUI_URL:-http://127.0.0.1:2053}
      XUI_API_TOKEN: ${XUI_API_TOKEN:?Set XUI_API_TOKEN}
      XRAY_API: ${XRAY_API:-127.0.0.1:62789}
      XRAY_METRICS_URL: ${XRAY_METRICS_URL:-}
      SCRAPE_TIMEOUT: 4s
      LISTEN_ADDRESS: :9108
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      COLLECT_CLIENT_STATS: ${COLLECT_CLIENT_STATS:-false}
      XUI_INSECURE_SKIP_VERIFY: ${XUI_INSECURE_SKIP_VERIFY:-false}
      WEB_BASIC_AUTH_USERNAME: ${WEB_BASIC_AUTH_USERNAME:-}
      WEB_BASIC_AUTH_PASSWORD: ${WEB_BASIC_AUTH_PASSWORD:-}
      WEB_BEARER_TOKEN: ${WEB_BEARER_TOKEN:-}
      WEB_AUTH_HEALTHZ: ${WEB_AUTH_HEALTHZ:-false}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE:-}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE:-}
      WEB_TLS_CLIENT_CA_FILE: ${WEB_TLS_CLIENT_CA_FILE:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
